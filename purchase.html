<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Purchase</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <main class="container my-5">
            <h1 class="mb-4">Purchase</h1>
            <form id="purchaseForm" class="row g-3" autocomplete="off">
                <div class="col-12">
                    <label for="storeName" class="form-label">Name of the store</label>
                    <input id="storeName" class="form-control" type="text" readonly>
                </div>
                <div class="col-12">
                    <label for="price" class="form-label">Price</label>
                    <input id="price" class="form-control" type="text" readonly>
                </div>
                <div class="col-12">
                    <label for="cardNumber" class="form-label">Credit Card number</label>
                    <input id="cardNumber" class="form-control" type="text" inputmode="numeric" autocomplete="cc-number" placeholder="1234 5678 9012 3456" maxlength="19" pattern="[0-9]{4} [0-9]{4} [0-9]{4} [0-9]{4}" required>
                </div>
                <div class="col-md-6">
                    <label for="expiration" class="form-label">Date of expiration</label>
                    <input id="expiration" class="form-control" type="date" placeholder="xx/xx/xxxx" required>
                </div>
                <div class="col-12">
                    <button class="btn btn-primary" type="submit">Send</button>
                </div>
            </form>
        </main>
        <script>
            const params = new URLSearchParams(window.location.search);
            document.querySelector('#storeName').value = params.get('store') || '';
            document.querySelector('#price').value = params.get('price') || '';

            // auto-format the CC number with spaces
            const cardNumber = document.querySelector('#cardNumber');
            cardNumber.addEventListener('input', function() {
                const digits = this.value.replace(/\D/g, '').slice(0, 16);
                this.value = digits.replace(/\d{4}(?=\d)/g, '$& ');
            });

            document.querySelector('#purchaseForm').addEventListener('submit', function(event) {
                event.preventDefault();
                alert('Purchase form sent.');
                window.close();
            });
        </script>
    </body>
</html>
